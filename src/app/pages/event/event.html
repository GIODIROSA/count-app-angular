<div class="container mx-auto p-4">
    <h1 class="text-3xl font-bold mb-6">Eventos</h1>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        @for (event of events$ | async; track event.id) {
        <div class="bg-white rounded-lg shadow-md overflow-hidden">
            <img [src]="event.imageUrl" [alt]="event.title" class="w-full h-48 object-cover">
            <div class="p-4">
                <h2 class="text-xl font-bold mb-2">{{ event.title }}</h2>
                <p class="text-gray-600 mb-2">{{ event.description }}</p>
                <p class="text-gray-600 mb-2">{{ event.date | date:'dd/MM/yyyy HH:mm' }}</p>
                <p class="text-gray-600 mb-2">{{ event.location }}</p>
                <p class="text-gray-600 mb-2">{{ event.category }}</p>
                <p class="text-gray-600 mb-2">{{ event.status }}</p>
                <p class="text-gray-600 mb-2">{{ event.price }}</p>
            </div>
        </div>
        }
    </div>

    <ng-template #loading>
        <p>Cargando eventos...</p>
    </ng-template>
</div>
